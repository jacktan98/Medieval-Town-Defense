  <path d="M120 400 V300 H392 V400 Z" fill="url(#wall)" stroke="#4d4a43" stroke-width="6"/>
  <path d="M120 300 V280 H144 V300 M168 300 V280 H192 V300 M216 300 V280 H240 V300 M272 300 V280 H296 V300 M320 300 V280 H344 V300 M368 300 V280 H392 V300" fill="url(#wall)" stroke="#4d4a43" stroke-width="6"/>
