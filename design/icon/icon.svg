  <path d="M84 404 V250 H156 V404 Z" fill="url(#wall)" stroke="#4d4a43" stroke-width="6"/>
  <path d="M356 404 V250 H428 V404 Z" fill="url(#wall)" stroke="#4d4a43" stroke-width="6"/>
  <path d="M74 252 L120 178 L166 252 Z" fill="url(#roof)" stroke="#1d3270" stroke-width="6" stroke-linejoin="round"/>
  <path d="M346 252 L392 178 L438 252 Z" fill="url(#roof)" stroke="#1d3270" stroke-width="6" stroke-linejoin="round"/>
  <rect x="110" y="290" width="20" height="30" rx="10" fill="#f2b24a"/><rect x="382" y="290" width="20" height="30" rx="10" fill="#f2b24a"/>
