  <path d="M200 190 L256 120 L312 190 Z" fill="url(#roof)" stroke="#1d3270" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 120 V62" stroke="#3a2a1a" stroke-width="6" stroke-linecap="round"/>
  <path d="M259 64 C280 56 296 76 320 66 V100 C296 110 280 90 259 98 Z" fill="#3f6fd6" stroke="#1d3270" stroke-width="4" stroke-linejoin="round"/>
  <rect x="240" y="216" width="32" height="40" rx="16" fill="#3a2a1a"/>
