<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a4f"/><stop offset=".55" stop-color="#4a4a6e"/><stop offset=".82" stop-color="#d98a4e"/><stop offset="1" stop-color="#f2c26b"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f8a3a"/><stop offset="1" stop-color="#2f4d22"/></linearGradient>
