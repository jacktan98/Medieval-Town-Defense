  <g stroke="#7a756a" stroke-width="3" fill="none" opacity=".7"><path d="M156 340 H222 M290 340 H356 M156 370 H222 M290 370 H356 M180 310 V340 M330 310 V340 M200 340 V370 M310 340 V370"/><path d="M84 330 H156 M84 366 H156 M356 330 H428 M356 366 H428 M206 240 H306 M206 270 H306"/></g>
