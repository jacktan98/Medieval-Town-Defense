<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#141a17} canvas{display:block}</style>
<canvas id="a"></canvas><canvas id="b"></canvas>
<script src="mini3d.js"></script>
<script src="models.js"></script>
<script>
const grass = mat('#5a7338');
function withGround(type, g) {
  const w = DEF[type].size * CELL;
  const root = new THREE.Group();
  root.add(new THREE.Mesh(new THREE.BoxGeometry(w + .5, .12, w + .5), grass)).position.y = -.06;
  root.add(g); return root;
}
const build = (type, tier) => withGround(type, MODELS[type](tier, false, type === 'wall' || type === 'gate' ? 10 : 0));
function sheet(id, title, rows) {
  const CW = 330, CH = 270, LW = 170, HEAD = 70, TOP = 26;
  const cols = Math.max(...rows.map(r => r.items.length));
  const cv = document.getElementById(id); cv.width = LW + CW * cols + 20; cv.height = HEAD + rows.length * (CH + TOP) + 10;
  const x = cv.getContext('2d');
  x.fillStyle = '#141a17'; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = '#d4a84e'; x.font = '30px Georgia, serif'; x.fillText(title, 20, 46);
  const tmp = document.createElement('canvas').getContext('2d');
  rows.forEach((row, ri) => {
    const y0 = HEAD + ri * (CH + TOP);
    x.fillStyle = '#ece2c8'; x.font = 'bold 19px sans-serif'; x.fillText(row.name, 20, y0 + TOP + 30);
    x.fillStyle = '#a69e87'; x.font = '14px sans-serif'; x.fillText(row.sub, 20, y0 + TOP + 52);
    const models = row.items.map(it => it.make());
    const sc = Math.min(...models.map(m => THREE.renderCell(tmp, m, 0, 0, CW - 16, CH - 10, { yaw: .7, pitch: .5 })));
    models.forEach((m, ci) => {
      const cx = LW + ci * CW, cy = y0 + TOP;
      x.fillStyle = '#1d231f'; x.fillRect(cx + 4, cy, CW - 8, CH); x.strokeStyle = '#3b3a2f'; x.strokeRect(cx + 4.5, cy + .5, CW - 9, CH - 1);
      THREE.renderCell(x, m, cx + 8, cy + 6, CW - 16, CH - 10, { yaw: .7, pitch: .5, scale: sc });
      x.fillStyle = '#ece2c8'; x.font = '15px sans-serif'; x.fillText(row.items[ci].label, cx + 8, y0 + TOP - 7);
    });
  });
}
const tiers = t => [1, 2, 3].map(k => ({ label: `Tier ${k} · ${DEF[t].tiers[k - 1]}`, make: () => build(t, k) }));
sheet('a', 'Farm · tiers 1 → 3', [
  { name: 'Farm', sub: '2×2 tiles', items: tiers('farm') },
]);
</script>
