<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#141a17}</style><canvas id="a"></canvas>
<script src="mini3d.js"></script><script src="people.js"></script>
<script>
const poses = [
 ['Lumberjack · wind-up', 'axe', v => { v.arms[0].rotation.x = v.arms[1].rotation.x = -2.7; v.pivot.rotation.x = -.6; v.body.rotation.x = .02; }],
 ['Lumberjack · chop', 'axe', v => { v.arms[0].rotation.x = v.arms[1].rotation.x = -.8; v.pivot.rotation.x = -.6; v.body.rotation.x = .14; }],
 ['Mason · strike', 'pick', v => { v.arms[0].rotation.x = v.arms[1].rotation.x = -.5; v.pivot.rotation.x = -.75; v.body.rotation.x = .22; }],
 ['Farmer · hoe down', 'hoe', v => { v.arms[0].rotation.x = v.arms[1].rotation.x = -.5; v.pivot.rotation.x = -1.05; v.body.rotation.x = .37; }],
 ['Builder · hammer', 'hammer', v => { v.arms[1].rotation.x = -1.8; v.arms[0].rotation.x = -.75; v.pivot.rotation.x = -.95; v.body.rotation.x = .12; }],
 ['Carrying a log', 'axe', v => { v.arms[1].rotation.x = -2.95; v.pivot.visible = false; v.carryLog.visible = true; }],
 ['Carrying stone', 'pick', v => { v.arms[0].rotation.x = v.arms[1].rotation.x = -1.2; v.pivot.visible = false; v.carryStone.visible = true; }],
 ['Walking with tool', 'pick', v => { v.arms[1].rotation.x = -.3; v.arms[0].rotation.x = .3; v.pivot.rotation.x = -.25; }],
];
const cv = document.getElementById('a'), CW = 230, CH = 260; cv.width = CW * 4; cv.height = CH * 2 + 10; const x = cv.getContext('2d');
x.fillStyle = '#141a17'; x.fillRect(0, 0, cv.width, cv.height);
poses.forEach(([label, kind, pose], i) => {
  const v = makePerson({}); v.carryLog = cyl(.085, .085, .9, 6, M.log, .19, 1.03, .02); v.carryLog.rotation.x = Math.PI / 2; v.carryLog.visible = false; v.body.add(v.carryLog);
  v.carryStone = box(.32, .26, .3, M.stone2, 0, .72, .26); v.carryStone.visible = false; v.body.add(v.carryStone);
  giveTool(v, kind); pose(v);
  const cx = (i % 4) * CW, cy = Math.floor(i / 4) * CH;
  x.fillStyle = '#1d231f'; x.fillRect(cx + 4, cy + 4, CW - 8, CH - 8);
  THREE.renderCell(x, v.g, cx + 10, cy + 30, CW - 20, CH - 40, { yaw: 1.25, pitch: .2, scale: 140 });
  x.fillStyle = '#ece2c8'; x.font = '14px sans-serif'; x.fillText(label, cx + 12, cy + 22);
});
</script>
