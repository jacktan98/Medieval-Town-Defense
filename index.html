<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Town Defense">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Medieval Town Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D field; town ledger top-left, tabbed build dock at the bottom, banners centred. Single dark look by choice. */
:root{
  --bg:#141a17; --panel:rgba(20,22,18,.9); --line:#3b3a2f; --parch:#ece2c8; --muted:#a69e87;
  --gold:#d4a84e; --ok:#8cc46e; --bad:#e2715b; --night:#a9bcf2;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--parch);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
[hidden]{display:none!important}
.flyCoin{position:fixed;left:0;top:0;width:16px;height:16px;pointer-events:none;z-index:60}
.chip.pulse{animation:chipPulse .35s ease-out}
@keyframes chipPulse{40%{transform:scale(1.18);border-color:var(--gold)}}
.guideCard{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:4px 6px 4px 12px;font-size:13.5px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.guideCard .gStep{color:var(--gold);font-variant-numeric:tabular-nums;font-size:12px}
.guideCard b{font-weight:600}
.guideCard button{min-height:26px;padding:1px 9px;font-size:12px;background:transparent;border-color:#4a4838;color:var(--muted);border-radius:6px}
.guidePulse{animation:guidePulse 1.1s ease-in-out infinite;border-color:var(--gold)!important}
@keyframes guidePulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,78,0)}50%{box-shadow:0 0 0 3px rgba(212,168,78,.9)}}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ico{display:inline-flex;width:15px;height:15px;vertical-align:-2px;flex-shrink:0}
.ico svg{width:100%;height:100%}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cost + .cost{margin-left:6px}
.panel{border-radius:8px!important;position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 16px));
  max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.title{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.phase{display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.phIco{width:26px;height:26px;flex-shrink:0;display:inline-flex}
.phIco svg{width:100%;height:100%}
.phMain{flex:1;min-width:0}
#phaseText{font-family:var(--display);font-size:17px;line-height:1.1;color:var(--gold)}
.tick{position:relative;width:30px;height:30px;flex-shrink:0}
.tick svg{width:100%;height:100%;transform:rotate(-90deg)}
.tickBg{fill:none;stroke:#2f3027;stroke-width:4}
.tickFg{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:94.25;transition:stroke-dashoffset .2s linear}
.tick span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--parch)}
#phaseText.night{color:var(--night)}
#phaseSub{font-size:12px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip .badge{font-style:normal;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:999px;background:#3c5a2c;color:#d8f0c4;margin-left:-1px}
.chip{border:1px solid #4a4838;background:#24261f;border-radius:6px;padding:3px 5px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chip .ico{width:14px;height:14px}
.chip b{font-size:14px;font-variant-numeric:tabular-nums}
.chip.low{border-color:var(--bad)} .chip.low b{color:var(--bad)}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
details summary::-webkit-details-marker{display:none}
details[open] summary::after{content:"Hide"} details:not([open]) summary::after{content:"Show"}
#log{max-height:34vh;overflow:auto;margin:5px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.35}
#log li::marker{color:var(--gold)}
#log .warn{color:var(--bad)} #log .good{color:var(--ok)}
.dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  width:max-content;max-width:calc(100% - 24px)}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.pill.ok{border-color:var(--ok);color:var(--ok)} .pill.bad{border-color:var(--bad);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;width:min(400px,100%)}
.card h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;color:var(--gold)}
.card p{margin:0;font-size:14px;color:var(--parch);font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.trades{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.trades button{min-height:28px;padding:0 6px;border-radius:7px;background:#24261f;font-size:12px;gap:3px;white-space:nowrap;justify-content:center}
.trades button .cost .ico{width:13px;height:13px} .trades .to{opacity:.75;margin:0 3px;font-size:19px;line-height:1;font-weight:700;position:relative;top:-1px}
.card button{flex-direction:row;gap:6px;min-height:38px}
.hpbar{height:6px;border-radius:3px;background:#3a2622;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.bar{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;max-width:100%}
.barTop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs,.util,.tools{display:flex;gap:4px;flex-wrap:wrap}
.tools{gap:5px}
.tools button{min-height:36px;padding:3px 9px;background:#2a2c24;border-color:#57533f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4)}
.tools button:hover{background:#33352b}
.tools button[aria-pressed="true"]{background:#3d3520;border-color:var(--gold)}
.tools button b{font-size:14px}
.tools button small{font-size:10.5px}
.tools{justify-content:center}
button{font:inherit;color:var(--parch);background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
button small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
button[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,168,78,.14);color:var(--gold)}
button.cant small{color:var(--bad)}
button.primary{border-color:var(--gold);color:var(--gold)}
button.danger{border-color:#6b3a33;color:var(--bad)}
.tab{min-height:28px;font-family:var(--display);font-size:14px;padding:1px 9px;border-color:transparent}
.tabs{background:rgba(0,0,0,.3);border-radius:6px;padding:2px;gap:2px}
.tab{border-radius:4px}
.tab[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,168,78,.16)}
.util{border-left:1px solid var(--line);padding-left:6px}
.util button{background:#24261f}
.util button{min-height:28px;font-size:12px;padding:1px 7px}
#nightBtn{min-height:28px;font-size:12px;padding:2px 9px;flex-shrink:0;background:#24261f;border-color:#57533f;flex-direction:row}
.banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,6vw,52px);
  color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.8);pointer-events:none;text-align:center;transition:opacity .6s;opacity:0;width:calc(100% - 32px)}
.banner.show{opacity:1} .banner.night{color:var(--night)}
.banner small{display:block;font-family:var(--body);font-size:16px;color:var(--parch)}
.modal{position:absolute;inset:0;background:rgba(8,10,9,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#1c1d18;border:1px solid var(--gold);border-radius:8px;padding:20px 22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--gold);text-wrap:balance}
.sheet h2.lost{color:var(--bad)}
.mapSheet{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;width:min(560px,100%)}
/* the title screen: dark over everything, the game isn't shown until a map is picked */
#mapPick{z-index:50;background:radial-gradient(ellipse at 50% 35%, #23271f 0%, #121410 70%, #0b0c09 100%)}
.gameTitle{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1.05;color:var(--gold);text-shadow:0 2px 18px rgba(0,0,0,.6);text-wrap:balance}
.mapSub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.maps{display:flex;gap:min(12px,2vw);justify-content:center;flex-wrap:wrap}
.mapBtn{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:6px 6px 8px;border-radius:12px;background:#24261f;border-color:#4a4838;width:min(170px,25vw)}
.mapBtn img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:#2e3a2c}
.mapBtn b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--parch)} .mapBtn.last{border-color:var(--gold)} .mapBtn.last b{color:var(--gold)}
.sheet p{margin:0;color:var(--muted)}
.sheet dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.sheet dt{color:var(--muted)} .sheet dd{margin:0;text-align:right;font-weight:700}
@media (max-width:640px){
  .panel{max-height:44%}
  #phaseText{font-size:16px}
  .chip{padding:2px 3px;gap:2px} .chip b{font-size:13px} .chip .ico{width:13px;height:13px}
  .tools button{min-height:34px;padding:2px 6px}
  .panel{width:calc(100% - 104px)}
}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));min-height:36px;padding:4px 12px;background:var(--panel);font-size:14px;flex-direction:row;gap:6px}
#pauseBtn svg{width:14px;height:14px}
.pausedTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(30px,7vw,56px);color:var(--parch);
  text-shadow:0 2px 12px rgba(0,0,0,.8);pointer-events:none}
/* bottom dock, card and pause: same tiles and tokens as the top panel */
.dock{gap:6px}
.pill{border-radius:8px;padding:4px 12px;font-size:13px;border-color:#4a4838;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pill.ok{border-color:#4a4838} .pill.bad{border-color:rgba(224,120,100,.45);background:rgba(58,24,20,.92)}
.pill .cost{vertical-align:middle;margin-top:-2px} .pill .ico{vertical-align:middle}
.pill b{font-weight:600;color:var(--parch)} .pill .sep{font-style:normal;opacity:.4;margin:0 7px} .pill .short{color:var(--bad)}
.bar{border-radius:10px;padding:6px;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.barTop{padding-bottom:6px;border-bottom:1px solid var(--line)}
.util{border-left:0;padding-left:0;gap:4px}
.iconBtn{width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border-radius:7px;background:#24261f;border-color:#4a4838;display:inline-flex;align-items:center;justify-content:center}
.iconBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:hover{background:#2f3128}
.iconBtn svg .solid{fill:currentColor}
.iconBtn[aria-pressed="true"]{background:#3d3520;border-color:var(--gold);color:var(--gold)}
.tools{gap:5px}
.tools button{min-width:66px;min-height:56px;padding:4px 7px 3px;border-radius:7px;gap:1px;background:#24261f;border-color:#4a4838}
.tools button .tIco{width:22px;height:22px;display:inline-flex;color:#cfc4a6}
.tools button .tIco svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="true"] .tIco{color:var(--gold)}
.tools button b{font-family:var(--body);font-weight:700;font-size:12px;line-height:1.15}
.tools button small{font-size:10.5px;line-height:1.1}
.tools button small .cost .ico{width:11px;height:11px}
.card{border-radius:10px;border-color:#6b5a2e;padding:7px 8px;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.35);width:fit-content;max-width:min(400px,100%);align-self:flex-end}   /* as narrow as its content (a path's is tiny), on the right */
.cardHead{display:flex;align-items:center;gap:6px}
.cardHead .iconBtn{width:30px;min-width:30px;height:30px;min-height:30px}
#volleyBtn{position:relative}
#volleyBtn .cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:700 11px/1 system-ui,sans-serif;color:#e8e2cc}
#volleyBtn.cool svg{opacity:.25}
#volleyBtn.off svg{opacity:.4}
#volleyBtn.cool .cd{display:flex}
.cardIco{width:30px;height:30px;border-radius:7px;background:#24261f;border:1px solid #4a4838;display:inline-flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.cardIco svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cardName{flex:1;min-width:0}
.card h4{font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardSub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.2}
.pips{display:inline-flex;gap:3px} .pips i{width:6px;height:6px;border-radius:50%;background:#3a3a30;border:1px solid #6b5a2e} .pips i.on{background:var(--gold);border-color:var(--gold)}
.hpbar{height:4px}
.stats{display:flex;flex-wrap:wrap;gap:2px 11px}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--parch);font-variant-numeric:tabular-nums}
.stat .ico{width:12px;height:12px} .stat{cursor:pointer}
.statTip{position:fixed;z-index:200;transform:translate(-50%,-100%);margin-top:-6px;padding:3px 8px;border-radius:6px;background:#1c1d18;border:1px solid #6b5a2e;color:var(--parch);font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)} .statTip.below{transform:translate(-50%,0);margin-top:6px}
.stat.good{color:var(--ok)} .stat.warn{color:#e6c46a} .stat.bad{color:var(--bad)}
.card .row{gap:5px;flex-wrap:nowrap;justify-content:flex-end} .card .row .cost + .cost{margin-left:4px} .card .row .cost .ico{width:13px;height:13px}
.card .row button{flex:1 1 0;min-width:0;min-height:30px;font-size:12.5px;border-radius:7px;background:#24261f;flex-direction:row;gap:5px;flex-wrap:nowrap;white-space:nowrap;padding:0 8px}
.card .row button.primary{background:#3d3520;flex:1 0 auto}
.card .row button.danger,.card .row button.ib{flex:0 0 auto} button.danger.armed{background:#8f3326;border-color:var(--bad);color:#fff} .card .row button.danger.armed{min-width:46px;justify-content:center}
button.armed .bIco{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mini{display:inline-block;width:38px;height:5px;border-radius:3px;background:#3a3a30;overflow:hidden;margin-right:2px} .mini i{display:block;height:100%;background:#e6c46a} .card .row button.ib{width:34px;padding:0}
.card .row .bIco{width:15px;height:15px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:38px;height:38px;min-height:38px;background:var(--panel);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pausedTag{position:absolute;inset:0;transform:none;top:0;left:0;display:flex;align-items:flex-start;justify-content:center;padding-top:18vh;background:rgba(10,12,10,.35);pointer-events:none;font-family:inherit;font-size:inherit;text-shadow:none}
.pauseCard{pointer-events:auto;background:var(--panel);border:1px solid #6b5a2e;border-radius:12px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.pauseT{font-family:var(--display);font-size:30px;color:var(--parch);line-height:1}
.pauseS{font-size:12px;color:var(--muted)}
.pauseBtns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pauseBtns .pIco{width:56px;min-width:56px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.pIco svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round} .pIco svg .solid{fill:currentColor}
.pauseCard button{min-height:34px;padding:4px 16px;border-radius:7px;background:#24261f;flex-direction:row}
.pauseCard button.primary{background:#3d3520}
@media (max-width:640px){ .tools button{min-width:60px;min-height:52px;padding:3px 5px 2px} }
/* admin + speed, bottom-right */
.corner{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cornerBtns{display:flex;gap:6px}
.cornerBtns .iconBtn{width:38px;height:38px;min-height:38px;background:var(--panel);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.cornerBtns .iconBtn[aria-pressed="true"]{background:#3d3520}
.spd{font-weight:700;font-size:13px}
.admin{background:var(--panel);border:1px solid #6b5a2e;border-radius:10px;padding:8px 10px;width:250px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.adminHead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:5px;border-bottom:1px solid var(--line)}
.adminHead b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold)}
.adminHead span{font-size:11px;color:var(--muted)}
.adminRes{display:flex;flex-direction:column;gap:4px}
.adRow{display:flex;align-items:center;gap:5px}
.adRow .ico{width:16px;height:16px}
.adRow input{width:72px;min-width:0;flex:1;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;color:var(--parch);background:#1a1c17;border:1px solid #4a4838;border-radius:6px;padding:3px 6px}
.adRow input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.adRow button,.adminRow button{min-height:28px;font-size:12px;padding:2px 7px;border-radius:6px;background:#24261f;border-color:#4a4838;flex-direction:row}
.adminRow{display:flex;gap:5px}
.adminRow button{flex:1}
.adminTog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--parch);cursor:pointer}
.adminTog input{accent-color:#d4a84e;width:15px;height:15px}
@media (max-width:640px){
  .corner{bottom:auto;top:52px}
  .corner{flex-direction:column-reverse}
  .cornerBtns{flex-direction:column}
}
/* short landscape screens (phones turned sideways) */
@media (max-height:520px){
  .panel{width:min(300px,calc(45% - 16px))}
  .dock{gap:4px;bottom:6px}
  .bar{padding:4px 5px;gap:4px}
  .barTop{padding-bottom:4px}
  .tools button{min-height:38px;min-width:58px;padding:2px 6px}
  .tools button .tIco{display:none}
  .tab{min-height:26px}
  .iconBtn{width:28px;min-width:28px;height:28px;min-height:28px}
  .dock{flex-direction:row;align-items:flex-end}
  .card{width:min(300px,calc(100vw - 340px));max-height:calc(100vh - 135px);overflow:auto}
  .pill{display:none}
  .corner{bottom:auto;top:52px;flex-direction:column-reverse}
  .cornerBtns{flex-direction:column}
  .admin{max-height:calc(100vh - 110px);overflow:auto}
  .pausedTag{padding-top:0;align-items:center}
}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}
/* design gallery: everything but the canvas and its own bar is hidden */
#app.gallery > :not(canvas):not(#galBar){display:none!important}
.galBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:12px;background:rgba(24,26,20,.88);border:1px solid #4a4838;color:#efe6cf;z-index:20}
.galBar b{padding:0 6px;font-family:inherit}
.galBar button{min-height:32px;padding:2px 10px}

// browsers only allow sound after the player touches the page; phones count only a finger lifting (touchend / click), not

// ---------- personal space: units ease apart instead of standing inside each other ----------
// villagers and live raiders push each other apart; a raider who has just fallen stays put as an obstacle,
// so a live one never stands in the same spot and looks like he got back up. Nobody is pushed into a building or water.
const sepUnits = [];
// castle and gate doors open while a villager is passing through, then swing shut
function updateDoors(dt) {
  for (const B of buildings) {
    if (B.type !== 'castle' && B.type !== 'gate') continue;
    const g = B.group;
    if (!g.userData.leaves) { const L = []; g.traverse(o => { if (o.userData.leaf !== undefined) L.push(o); }); g.userData.leaves = L; }
    if (!g.userData.leaves.length) continue;

    let want = 0;
    if (p && B.built && !B.dead) for (const v of villagers) {
      if (!v.g.visible) continue;
      const d = Math.hypot((v.rx ?? v.x) - p.x, (v.rz ?? v.z) - p.z);

    for (const l of g.userData.leaves) l.rotation.y = l.userData.leaf * B.doorK;
  }
}
function separateUnits(dt) {
  sepUnits.length = 0;
  for (const v of villagers) if (v.g.visible && !v.doorWalk && !v.inside && !(v.hideT > 0) && (!v.posted || v.soldier) && !v.sleeping) sepUnits.push({ u: v, r: .24, fixed: false, mode: 1, w: v.working ? .1 : v.walking ? 1 : .35 });
  for (const e of enemies) sepUnits.push({ u: e, r: e.horse ? .55 : .26, fixed: e.dead, mode: 2, w: e.walking ? 1 : .35 });
  const k = Math.min(1, dt * 10);

    const A = sepUnits[i], B = sepUnits[j]; if (A.fixed && B.fixed) continue;
    let dx = B.u.x - A.u.x, dz = B.u.z - A.u.z; const min = A.r + B.r, d2 = dx * dx + dz * dz;
    if (d2 >= min * min) continue;
    let d = Math.sqrt(d2); if (d < 1e-4) { const a = Math.random() * 6.283; dx = Math.cos(a); dz = Math.sin(a); d = 1; }
    const push = (min - d) * k, nx = dx / d, nz = dz / d, wa = A.fixed ? 0 : A.w, wb = B.fixed ? 0 : B.w, sa = wa / (wa + wb), sb = 1 - sa;

    if (!B.fixed) { const x = B.u.x + nx * push * sb, z = B.u.z + nz * push * sb; if (canStand(x, z, B.mode) && Math.abs(walkY(x, z) - walkY(B.u.x, B.u.z)) < .3) { B.u.x = x; B.u.z = z; } }
  }
}

// ---------- juice: camera shake, debris, coins to the counter ----------
var shakeT = 0, shakeAmp = 0;

var shakeNext = {};

const hitFlashM = new THREE.MeshStandardMaterial({ color: '#ffb0a0', emissive: new THREE.Color('#ff3b2a'), emissiveIntensity: .8, flatShading: true });
const debris = [];
function debrisBurst(B, c) {
  const m = B.tier >= 2 && B.type !== 'house' ? M.stone2 : M.wood, n = B.ev.s > 1 ? 18 : 11, y = B.group.position.y + .8;
  for (let i = 0; i < n; i++) {
    const s = .08 + Math.random() * .14, o = box(s, s * (.6 + Math.random()), s * (.8 + Math.random() * .8), i % 3 ? m : M.timber, c.x + (Math.random() - .5) * B.ev.s, y + Math.random() * .8, c.z + (Math.random() - .5) * B.ev.s);

}
function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i], o = d.o; d.life -= dt;
    d.vy -= 14 * dt; o.position.x += d.vx * dt; o.position.y += d.vy * dt; o.position.z += d.vz * dt;

// coins rise from a building and fly to the gold counter, which pulses as they land
let coinsInFlight = 0;
const RES_CHIP = { gold: '#cGold', wood: '#cWood', stone: '#cStone', food: '#cFood' };
function coinFly(x, y, z, n, kind = 'gold') {
  const chip = $(RES_CHIP[kind]); if (!chip || document.hidden) return;
  const p = new THREE.Vector3(x, y, z).project(camera); if (p.z > 1 || Math.abs(p.x) > 1.1 || Math.abs(p.y) > 1.1) return;
  const r = canvas.getBoundingClientRect(), sx = r.left + (p.x + 1) / 2 * r.width, sy = r.top + (1 - p.y) / 2 * r.height;
  const t = chip.getBoundingClientRect(), tx = t.left + 10, ty = t.top + t.height / 2 - 8;

    const el = document.createElement('span'); el.className = 'flyCoin'; el.innerHTML = ICON[kind]; document.body.appendChild(el); coinsInFlight++;
    const jx = (Math.random() - .5) * 30, mx = sx + jx + (tx - sx) * .3, my = Math.min(sy, ty) - 40 - Math.random() * 30;

      { transform: `translate(${mx}px, ${my}px) scale(1.15)`, opacity: 1, offset: .35 },

// ---------- guided first day: one short step at a time, the button to press pulses; shown once per device ----------
var GUIDE = [
  { text: 'Build a house', tool: 'house', cat: 'eco', done: () => buildings.some(B => B.type === 'house') },
  { text: 'Lumber by trees', tool: 'lodge', cat: 'eco', done: () => buildings.some(B => B.type === 'lodge') },
  { text: 'Farm for food', tool: 'farm', cat: 'eco', done: () => buildings.some(B => B.type === 'farm') },
  { text: 'Archers', tool: 'tower', cat: 'def', done: () => buildings.some(B => B.type === 'tower') },
  { text: 'Upgrade a building', tool: 'select', done: () => buildings.some(B => B.tier > 1 || (B.site && B.site.kind === 'up')) },
];
var guideOn = false, guideStep = -1, guideEndT = 0;
try { guideOn = localStorage.getItem('mtd-guide') !== 'done'; } catch (e) { guideOn = true; }
function guideFinish() { guideOn = false; try { localStorage.setItem('mtd-guide', 'done'); } catch (e) {} guideMark(); }
function guideMark() {
  document.querySelectorAll('.guidePulse').forEach(el => el.classList.remove('guidePulse'));
  const g = $('#guide'); if (!g) return;
  if (!guideOn || gameOver || guideStep < 0) { if (!guideEndT) g.hidden = true; return; }
  const S = GUIDE[guideStep]; g.hidden = false;
  $('#gStep').textContent = `${guideStep + 1}/${GUIDE.length}`; $('#gText').textContent = S.text;
  if (tool !== S.tool) {
    if (S.cat && cat !== S.cat) { const tab = document.querySelector(`.tab[data-cat="${S.cat}"]`); if (tab) tab.classList.add('guidePulse'); }
    else { const b = document.querySelector(`.tool[data-tool="${S.tool}"]`); if (b) b.classList.add('guidePulse'); }
  }
}
function guideTick() {
  const g = $('#guide'); if (!g) return;
  if (guideEndT && performance.now() > guideEndT) { guideEndT = 0; g.hidden = true; }
  if (!guideOn) return;
  const next = GUIDE.findIndex(S => !S.done());
  if (next < 0) { $('#gStep').textContent = '✓'; $('#gText').textContent = 'Ready for night'; guideEndT = performance.now() + 3500; guideFinish(); g.hidden = false; return; }
  if (next !== guideStep) { guideStep = next; guideMark(); }
}
$('#gSkip').addEventListener('click', () => { guideFinish(); $('#guide').hidden = true; });

// every 3 s: if frames averaged over 24 ms (under ~40 fps), drop the resolution half a step, down to 1.5× at most
function adaptResolution(raw) {
  if (raw > .2) return;                          // a hidden tab or a stall, not the render cost
  fpsAcc += raw; fpsN++;
  if (fpsAcc < 3) return;
  const ms = fpsAcc / fpsN * 1000; fpsAcc = fpsN = 0;
  if (ms > 24 && pixelK > 1.5) { pixelK = Math.max(1.5, pixelK - .5); renderer.setPixelRatio(pixelK); resize(); }
}
function frame(now) {
  adaptResolution((now - last) / 1000);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  keyCamera(dt);
  if (galleryOn) { updateGallery(dt, now); renderer.render(gScene, camera); requestAnimationFrame(frame); return; } updateLamps(dt, now); updateLight(dt, now);
  if (paused) { renderer.render(scene, camera); requestAnimationFrame(frame); if ((hudT -= dt) <= 0) { hudT = .2; updateHud(); } return; }
  const gdt = dt * gameSpeed;            // game time runs faster at 2×; the camera does not
  if (!gameOver) { updatePhase(gdt); updateVillagers(gdt, now); updateEnemies(gdt); updateDefense(gdt); separateUnits(gdt); updateDoors(gdt); updateFallen(gdt); updateChips(gdt); updateSplashes(gdt); }
  updateArrows(gdt); updateVolley(gdt); updateTrees(now); emitSmoke(gdt); updateBirds(gdt);
  if (anims.length) {
    for (let n = anims.length - 1; n >= 0; n--) { const a = anims[n], t = clamp((now - a.t0) / a.dur, 0, 1); applyPlan(a.plan, easeOut(t)); if (t >= 1) anims.splice(n, 1); }
    syncTerrain();
    if (cur && DEF[tool] && ghosts[tool] && ghosts[tool].visible) drape(footLine, cur.x0, cur.z0, cur.x1, cur.z1);
    if (selected) drape(selLine, selected.ev.x0 - .1, selected.ev.z0 - .1, selected.ev.x1 + .1, selected.ev.z1 + .1);
  }
  if ((buildT -= dt) <= 0) { buildT = .5; if (!gameOver) { assignBuilders(); if (PH.kind === 'day') assignJobs(); } }
  for (const B of buildings.slice()) {
    if (B.site) {
      const p = clamp(B.site.progress, 0, 1);
      if (B.site.kind === 'new') B.group.scale.y = .08 + .92 * p;
      if (B.site.kind === 'repair') B.hp = B.site.hp0 + (B.max - B.site.hp0) * p;
      B.pbar.grp.visible = true; B.pbar.set(Math.max(p, .02)); B.pbar.fg.material.color.set(B.site.kind === 'repair' ? '#8cc46e' : '#e0b84a');
      B.pbar.grp.position.set(center(B).x, B.group.position.y + BAR_TOP[B.type] + .3, center(B).z);
      if (p >= 1) completeSite(B);
    }
    if (B.pop) { const t = clamp((now - B.pop) / 450, 0, 1), k = 1 + .09 * Math.sin(t * Math.PI) * (1 - t); B.group.scale.x = B.group.scale.z = k; if (t >= 1) { B.group.scale.x = B.group.scale.z = 1; B.pop = 0; } }

    B.bar.grp.visible = B.hp < B.max; B.bar.set(B.hp / B.max); B.bar.grp.position.set(c.x, B.group.position.y + BAR_TOP[B.type], c.z);

  updateDebris(dt);
  const sh = shakeOffset(dt); camera.position.add(sh);
  renderer.render(scene, camera);
  camera.position.sub(sh);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (/[?&]gallery\b/.test(location.search)) openGallery();
// dev hook: open with ?debug to evaluate code inside the game scope from the console (window.G('dist=20;updateCam()'))
if (/[?&]debug\b/.test(location.search)) window.G = s => eval(s);
})();
