<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Medieval Town Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D field; town ledger top-left, tabbed build dock at the bottom, banners centred. Single dark look by choice. */
:root{
  --bg:#141a17; --panel:rgba(20,22,18,.9); --line:#3b3a2f; --parch:#ece2c8; --muted:#a69e87;
  --gold:#d4a84e; --ok:#8cc46e; --bad:#e2715b; --night:#a9bcf2;
  --display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--parch);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
[hidden]{display:none!important}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ico{display:inline-flex;width:15px;height:15px;vertical-align:-2px;flex-shrink:0}
.ico svg{width:100%;height:100%}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cost + .cost{margin-left:6px}
.panel{border-radius:8px!important;position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 16px));
  max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:5px}
.title{font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.phase{display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.phIco{width:26px;height:26px;flex-shrink:0;display:inline-flex}
.phIco svg{width:100%;height:100%}
.phMain{flex:1;min-width:0}
#phaseText{font-family:var(--display);font-size:17px;line-height:1.1;color:var(--gold)}
.tick{position:relative;width:30px;height:30px;flex-shrink:0}
.tick svg{width:100%;height:100%;transform:rotate(-90deg)}
.tickBg{fill:none;stroke:#2f3027;stroke-width:4}
.tickFg{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-dasharray:94.25;transition:stroke-dashoffset .2s linear}
.tick span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--parch)}
#phaseText.night{color:var(--night)}
#phaseSub{font-size:12px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.chip .badge{font-style:normal;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:999px;background:#3c5a2c;color:#d8f0c4;margin-left:-1px}
.chip{border:1px solid #4a4838;background:#24261f;border-radius:6px;padding:3px 5px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chip .ico{width:14px;height:14px}
.chip b{font-size:14px;font-variant-numeric:tabular-nums}
.chip.low{border-color:var(--bad)} .chip.low b{color:var(--bad)}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
details summary::-webkit-details-marker{display:none}
details[open] summary::after{content:"Hide"} details:not([open]) summary::after{content:"Show"}
#log{max-height:34vh;overflow:auto;margin:5px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.35}
#log li::marker{color:var(--gold)}
#log .warn{color:var(--bad)} #log .good{color:var(--ok)}
.dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  width:max-content;max-width:calc(100% - 24px)}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.pill.ok{border-color:var(--ok);color:var(--ok)} .pill.bad{border-color:var(--bad);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;width:min(400px,100%)}
.card h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;color:var(--gold)}
.card p{margin:0;font-size:14px;color:var(--parch);font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{flex-direction:row;gap:6px;min-height:38px}
.hpbar{height:6px;border-radius:3px;background:#3a2622;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.bar{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;max-width:100%}
.barTop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs,.util,.tools{display:flex;gap:4px;flex-wrap:wrap}
.tools{gap:5px}
.tools button{min-height:36px;padding:3px 9px;background:#2a2c24;border-color:#57533f;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4)}
.tools button:hover{background:#33352b}
.tools button[aria-pressed="true"]{background:#3d3520;border-color:var(--gold)}
.tools button b{font-size:14px}
.tools button small{font-size:10.5px}
.tools{justify-content:center}
button{font:inherit;color:var(--parch);background:transparent;border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
button small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
button[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,168,78,.14);color:var(--gold)}
button.cant small{color:var(--bad)}
button.primary{border-color:var(--gold);color:var(--gold)}
button.danger{border-color:#6b3a33;color:var(--bad)}
.tab{min-height:28px;font-family:var(--display);font-size:14px;padding:1px 9px;border-color:transparent}
.tabs{background:rgba(0,0,0,.3);border-radius:6px;padding:2px;gap:2px}
.tab{border-radius:4px}
.tab[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,168,78,.16)}
.util{border-left:1px solid var(--line);padding-left:6px}
.util button{background:#24261f}
.util button{min-height:28px;font-size:12px;padding:1px 7px}
#nightBtn{min-height:28px;font-size:12px;padding:2px 9px;flex-shrink:0;background:#24261f;border-color:#57533f;flex-direction:row}
.banner{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,6vw,52px);
  color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.8);pointer-events:none;text-align:center;transition:opacity .6s;opacity:0;width:calc(100% - 32px)}
.banner.show{opacity:1} .banner.night{color:var(--night)}
.banner small{display:block;font-family:var(--body);font-size:16px;color:var(--parch)}
.modal{position:absolute;inset:0;background:rgba(8,10,9,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#1c1d18;border:1px solid var(--gold);border-radius:8px;padding:20px 22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--gold);text-wrap:balance}
.sheet h2.lost{color:var(--bad)}
.sheet p{margin:0;color:var(--muted)}
.sheet dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.sheet dt{color:var(--muted)} .sheet dd{margin:0;text-align:right;font-weight:700}
@media (max-width:640px){
  .panel{max-height:44%}
  #phaseText{font-size:16px}
  .chip{padding:2px 3px;gap:2px} .chip b{font-size:13px} .chip .ico{width:13px;height:13px}
  .tools button{min-height:34px;padding:2px 6px}
  .panel{width:calc(100% - 104px)}
}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));min-height:36px;padding:4px 12px;background:var(--panel);font-size:14px;flex-direction:row;gap:6px}
#pauseBtn svg{width:14px;height:14px}
.pausedTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(30px,7vw,56px);color:var(--parch);
  text-shadow:0 2px 12px rgba(0,0,0,.8);pointer-events:none}
/* bottom dock, card and pause: same tiles and tokens as the top panel */
.dock{gap:6px}
.pill{border-radius:8px;padding:4px 12px;font-size:13px;border-color:#4a4838;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pill.ok{border-color:#4a4838;border-left:3px solid var(--ok)} .pill.bad{border-color:#4a4838;border-left:3px solid var(--bad)}
.pill .cost{vertical-align:middle;margin-top:-2px} .pill .ico{vertical-align:middle}
.pill b{font-weight:600;color:var(--parch)} .pill .sep{font-style:normal;opacity:.4;margin:0 7px} .pill .short{color:var(--bad)}
.bar{border-radius:10px;padding:6px;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.barTop{padding-bottom:6px;border-bottom:1px solid var(--line)}
.util{border-left:0;padding-left:0;gap:4px}
.iconBtn{width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border-radius:7px;background:#24261f;border-color:#4a4838;display:inline-flex;align-items:center;justify-content:center}
.iconBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:hover{background:#2f3128}
.iconBtn svg .solid{fill:currentColor}
.iconBtn[aria-pressed="true"]{background:#3d3520;border-color:var(--gold);color:var(--gold)}
.tools{gap:5px}
.tools button{min-width:66px;min-height:56px;padding:4px 7px 3px;border-radius:7px;gap:1px;background:#24261f;border-color:#4a4838}
.tools button .tIco{width:22px;height:22px;display:inline-flex;color:#cfc4a6}
.tools button .tIco svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="true"] .tIco{color:var(--gold)}
.tools button b{font-family:var(--body);font-weight:700;font-size:12px;line-height:1.15}
.tools button small{font-size:10.5px;line-height:1.1}
.tools button small .cost .ico{width:11px;height:11px}
.card{border-radius:10px;border-color:#6b5a2e;padding:8px 10px;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.cardHead{display:flex;align-items:center;gap:8px}
.cardIco{width:34px;height:34px;border-radius:7px;background:#24261f;border:1px solid #4a4838;display:inline-flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.cardIco svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cardName{flex:1;min-width:0}
.card h4{font-size:17px;line-height:1.1}
.cardSub{font-size:12px;color:var(--muted)}
.hpbar{height:5px}
.stats{display:flex;flex-wrap:wrap;gap:4px}
.stat{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#24261f;border:1px solid #4a4838;font-variant-numeric:tabular-nums}
.stat .ico{width:12px;height:12px}
.stat.good{color:var(--ok);border-color:#3c5a2c} .stat.warn{color:#e6c46a;border-color:#6b5a2e} .stat.bad{color:var(--bad);border-color:#6b3a33}
.card .row{gap:6px}
.card .row button{flex:1;min-height:34px;font-size:13px;border-radius:7px;background:#24261f;flex-direction:row;gap:5px;flex-wrap:wrap}
.card .row button.primary{background:#3d3520}
#pauseBtn{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:38px;height:38px;min-height:38px;background:var(--panel);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pausedTag{position:absolute;inset:0;transform:none;top:0;left:0;display:flex;align-items:flex-start;justify-content:center;padding-top:18vh;background:rgba(10,12,10,.35);pointer-events:none;font-family:inherit;font-size:inherit;text-shadow:none}
.pauseCard{pointer-events:auto;background:var(--panel);border:1px solid #6b5a2e;border-radius:12px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.pauseT{font-family:var(--display);font-size:30px;color:var(--parch);line-height:1}
.pauseS{font-size:12px;color:var(--muted)}
.pauseBtns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.pauseCard button{min-height:34px;padding:4px 16px;border-radius:7px;background:#24261f;flex-direction:row}
.pauseCard button.primary{background:#3d3520}
@media (max-width:640px){ .tools button{min-width:60px;min-height:52px;padding:3px 5px 2px} }
/* admin + speed, bottom-right */
.corner{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cornerBtns{display:flex;gap:6px}
.cornerBtns .iconBtn{width:38px;height:38px;min-height:38px;background:var(--panel);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.cornerBtns .iconBtn[aria-pressed="true"]{background:#3d3520}
.spd{font-weight:700;font-size:13px}
.admin{background:var(--panel);border:1px solid #6b5a2e;border-radius:10px;padding:8px 10px;width:250px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.adminHead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:5px;border-bottom:1px solid var(--line)}
.adminHead b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold)}
.adminHead span{font-size:11px;color:var(--muted)}
.adminRes{display:flex;flex-direction:column;gap:4px}
.adRow{display:flex;align-items:center;gap:5px}
.adRow .ico{width:16px;height:16px}
.adRow input{width:72px;min-width:0;flex:1;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;color:var(--parch);background:#1a1c17;border:1px solid #4a4838;border-radius:6px;padding:3px 6px}
.adRow input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.adRow button,.adminRow button{min-height:28px;font-size:12px;padding:2px 7px;border-radius:6px;background:#24261f;border-color:#4a4838;flex-direction:row}
.adminRow{display:flex;gap:5px}
.adminRow button{flex:1}
.adminTog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--parch);cursor:pointer}
.adminTog input{accent-color:#d4a84e;width:15px;height:15px}
@media (max-width:640px){
  .corner{bottom:auto;top:52px}
  .corner{flex-direction:column-reverse}
  .cornerBtns{flex-direction:column}
}
/* short landscape screens (phones turned sideways) */
@media (max-height:520px){
  .panel{width:min(300px,calc(45% - 16px))}
  .dock{gap:4px;bottom:6px}
  .bar{padding:4px 5px;gap:4px}
  .barTop{padding-bottom:4px}
  .tools button{min-height:38px;min-width:58px;padding:2px 6px}
  .tools button .tIco{display:none}
  .tab{min-height:26px}
  .iconBtn{width:28px;min-width:28px;height:28px;min-height:28px}
  .dock{flex-direction:row;align-items:flex-end}
  .card{width:min(300px,calc(100vw - 340px));max-height:calc(100vh - 135px);overflow:auto}
  .pill{display:none}
  .corner{bottom:auto;top:52px;flex-direction:column-reverse}
  .cornerBtns{flex-direction:column}
  .admin{max-height:calc(100vh - 110px);overflow:auto}
  .pausedTag{padding-top:0;align-items:center}
}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div class="panel">
    <div class="phase">
      <span class="phIco" id="phIco"></span>
      <div class="phMain"><div id="phaseText">Day 1 of 3</div><div id="phaseSub">Night in 5:00</div></div>
      <div class="tick" id="tick" title="Next payout from buildings">
        <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="tickBg"/><circle cx="18" cy="18" r="15" class="tickFg" id="tickRing"/></svg>
        <span id="tickN">20</span>
      </div>
      <button id="nightBtn" title="Start the night now">Skip day</button>
    </div>
    <div class="res">
      <div class="chip" id="cGold" title="Gold"><span class="ico" data-ico="gold"></span><b>0</b></div>
      <div class="chip" id="cWood" title="Wood"><span class="ico" data-ico="wood"></span><b>0</b></div>
      <div class="chip" id="cStone" title="Stone"><span class="ico" data-ico="stone"></span><b>0</b></div>
      <div class="chip" id="cFood" title="Food"><span class="ico" data-ico="food"></span><b>0</b></div>
      <div class="chip" id="cPop" title="Villagers; the green badge is how many are idle"><span class="ico" data-ico="pop"></span><b>0</b><i class="badge">0</i></div>
    </div>
    <details id="ledger">
      <summary>Town log</summary>
      <ol id="log"></ol>
    </details>
  </div>
  <div class="banner" id="banner"></div>
  <button class="iconBtn" id="pauseBtn" aria-pressed="false" aria-label="Pause" title="Pause (P)"></button>
  <div class="corner">
    <div class="admin" id="admin" hidden>
      <div class="adminHead"><b>Admin</b><span>testing tools</span></div>
      <div class="adminRes" id="adminRes"></div>
      <div class="adminRow"><button id="adFill">Fill all to 9,999</button><button id="adFinish">Finish all building</button></div>
      <label class="adminTog"><input type="checkbox" id="adInstant"> Instant build and upgrades</label>
      <div class="adminRow"><button id="adPop">+5 villagers</button><button id="adDay">Skip to night</button></div>
    </div>
    <div class="cornerBtns">
      <button class="iconBtn" id="muteBtn" aria-pressed="false" aria-label="Mute sound" title="Sound on (M to mute)"></button>
      <button class="iconBtn" id="speedBtn" aria-pressed="false" aria-label="Game speed 1×" title="Game speed"><span class="spd">1×</span></button>
      <button class="iconBtn" id="adminBtn" aria-pressed="false" aria-label="Admin" title="Admin tools"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 a4 4 0 0 0 4.9 5 l-8.6 8.6 a2.1 2.1 0 0 1-3-3 l8.6-8.6 a4 4 0 0 0-1.9-2z"/><path d="M5 5 L9 9"/></svg></button>
    </div>
  </div>
  <div class="pausedTag" id="pausedTag" hidden><div class="pauseCard"><div class="pauseT">Paused</div><div class="pauseS">The camera still moves</div><div class="pauseBtns"><button class="primary" id="resumeBtn">Resume</button><button id="fsBtn">Full screen</button><button class="danger" id="reset">Restart</button></div></div></div>
  <div class="dock">
    <div class="card" id="card" hidden>
      <div class="cardHead">
        <span class="cardIco" id="cardIco"></span>
        <div class="cardName"><h4 id="cardTitle"></h4><div class="cardSub" id="cardSub"></div></div>
        <button class="iconBtn" id="closeCard" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
      </div>
      <div class="hpbar"><i id="cardHp"></i></div>
      <div class="stats" id="cardStats"></div>
      <div class="row"><button class="primary" id="upBtn"></button><button id="cardRotBtn" hidden title="Rotate"><svg style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1-2.05-4.95"/><path d="M19.2 3.8 V7.5 H15.5"/></svg>Rotate</button><button class="danger" id="demBtn"></button></div>
    </div>
    <div class="pill" id="hint">Pick a building</div>
    <div class="bar">
      <div class="barTop">
        <div class="tabs">
          <button class="tab" data-cat="eco" aria-pressed="true">Economy</button>
          <button class="tab" data-cat="def" aria-pressed="false">Defences</button>
          <button class="tab" data-cat="decor" aria-pressed="false">Decor</button>
